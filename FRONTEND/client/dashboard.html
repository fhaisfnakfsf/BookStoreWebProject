<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Nhúng CSS định dạng riêng cho phần nội dung sách -->
    <link rel="stylesheet" href="dashboard.css">
    <!-- Nhúng FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <!-- Header: Thanh tìm kiếm & Giỏ hàng -->
    <div class="top-header">
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Tìm kiếm sách theo tên, tác giả, thể loại...">
            <button class="btn-search">Tìm kiếm</button>
        </div>
        <div class="header-right">
            <button class="icon-btn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="badge">3</span>
            </button>
            <button class="icon-btn">
                <i class="fa-solid fa-user-circle"></i>
            </button>
        </div>
    </div>

    <!-- Nội dung chính: Lưới sách nổi bật -->
    <div class="content-body">
        <div class="section-title">
            <h2>Sách nổi bật</h2>
            <select class="filter-dropdown">
                <option>Mới nhất</option>
                <option>Giá tăng dần</option>
                <option>Giá giảm dần</option>
            </select>
        </div>

        <div class="book-grid">
            <!-- Sách 1 -->
            <div class="book-card">
                <div class="book-img" style="background: #bae6fd; color: #0369a1;">Dế Mèn Phiêu Lưu Ký</div>
                <h3 class="book-name">Dế Mèn Phiêu Lưu Ký</h3>
                <p class="book-author">Tô Hoài</p>
                <div class="book-footer">
                    <span class="book-price">79.000 đ</span>
                    <button class="btn-add-cart"><i class="fa-solid fa-cart-plus"></i> Thêm vào giỏ</button>
                </div>
            </div>
            <!-- Sách 2 -->
            <div class="book-card">
                <div class="book-img" style="background: #fed7aa; color: #c2410c;">Hoàng Tử Bé</div>
                <h3 class="book-name">Hoàng Tử Bé</h3>
                <p class="book-author">Antoine de Saint-Exupéry</p>
                <div class="book-footer">
                    <span class="book-price">89.000 đ</span>
                    <button class="btn-add-cart"><i class="fa-solid fa-cart-plus"></i> Thêm vào giỏ</button>
                </div>
            </div>
            <!-- Sách 3 -->
            <div class="book-card">
                <div class="book-img" style="background: #e9d5ff; color: #7e22ce;">Harry Potter</div>
                <h3 class="book-name">Harry Potter và Hòn Đá Phù Thủy</h3>
                <p class="book-author">J.K. Rowling</p>
                <div class="book-footer">
                    <span class="book-price">199.000 đ</span>
                    <button class="btn-add-cart"><i class="fa-solid fa-cart-plus"></i> Thêm vào giỏ</button>
                </div>
            </div>
            <!-- Sách 4 -->
            <div class="book-card">
                <div class="book-img" style="background: #fecdd3; color: #be123c;">One Piece</div>
                <h3 class="book-name">One Piece - Tập 1</h3>
                <p class="book-author">Eiichiro Oda</p>
                <div class="book-footer">
                    <span class="book-price">45.000 đ</span>
                    <button class="btn-add-cart"><i class="fa-solid fa-cart-plus"></i> Thêm vào giỏ</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
